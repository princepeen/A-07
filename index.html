<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>For Ashu</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#f5f3f0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <style>
    /* ── Index-specific layout ── */
    html, body {
      overflow: hidden;
      height: 100%;
    }

    /* ── Stage ── */
    .stage {
      position: fixed; inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 2rem;
    }

    /* ── Eyebrow ── */
    .eyebrow {
      font-size: 0.56rem;
      font-weight: 200;
      letter-spacing: 0.46em;
      text-transform: uppercase;
      color: var(--text-dim);
      opacity: 0;
      animation: rise 1.6s var(--ease-out) 0.3s forwards;
    }

    /* ── Name ── */
    .name {
      font-family: var(--font-serif);
      font-weight: 300;
      font-size: clamp(5rem, 22vw, 8.5rem);
      letter-spacing: 0.14em;
      line-height: 1;
      margin-top: 0.55rem;
      background: linear-gradient(158deg, #eae4dc 0%, #ccc0b6 42%, #b6b0c6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0;
      animation: rise 2.2s var(--ease-out) 0.6s forwards;
      user-select: none;
    }

    /* ── Tagline ── */
    .tagline {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 300;
      font-size: clamp(0.82rem, 3.2vw, 1rem);
      color: var(--accent-lavender);
      letter-spacing: 0.09em;
      margin-top: 1rem;
      opacity: 0;
      animation: rise 2s var(--ease-out) 1s forwards;
    }

    /* ── Vertical rule ── */
    .v-rule {
      width: 1px;
      height: 56px;
      background: linear-gradient(to bottom, transparent, var(--line), transparent);
      margin: 2.8rem 0 2.5rem;
      opacity: 0;
      animation: rise 1.8s ease 1.4s forwards;
    }

    /* ── Enter button ── */
    .enter-btn {
      opacity: 0;
      animation: rise 1.8s var(--ease-out) 1.8s forwards;
    }

    /* ── Bottom verse ── */
    .verse {
      position: fixed;
      bottom: max(2.4rem, env(safe-area-inset-bottom, 2.4rem));
      left: 0; right: 0;
      text-align: center;
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 0.8rem;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      line-height: 1.7;
      opacity: 0;
      animation: rise 2s ease 2.5s forwards;
      z-index: 10;
      padding: 0 2rem;
    }

    /* ── Top corner date ── */
    .corner-date {
      position: fixed;
      top: max(1.8rem, env(safe-area-inset-top, 1.8rem));
      right: 1.8rem;
      font-size: 0.52rem;
      font-weight: 200;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--text-dim);
      opacity: 0;
      animation: fadein 2s ease 3s forwards;
      z-index: 10;
    }

    /* ── Horizontal hairlines flanking name ── */
    .name-row {
      display: flex;
      align-items: center;
      gap: 1.4rem;
      opacity: 0;
      animation: rise 2.2s var(--ease-out) 0.6s forwards;
    }

    .hair {
      flex: 1;
      max-width: 40px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--line));
    }
    .hair.right {
      background: linear-gradient(to left, transparent, var(--line));
    }
  </style>
</head>
<body>

  <!-- Star canvas -->
  <canvas id="sky-canvas"></canvas>

  <!-- Ambient light -->
  <div class="ambient-base"></div>

  <!-- Corner date -->
  <span class="corner-date" id="cornerDate"></span>

  <!-- Main stage -->
  <div class="stage">
    <span class="eyebrow">a gift, made for one</span>

    <div class="name-row">
      <span class="hair"></span>
      <h1 class="name" style="animation:none;opacity:1;">Ashu</h1>
      <span class="hair right"></span>
    </div>

    <span class="tagline">something quiet, something only yours</span>

    <div class="v-rule"></div>

    <button class="enter-btn" id="enterBtn" aria-label="Enter">
      <span class="btn-line"></span>
      <span class="btn-text">Enter</span>
      <span class="btn-arrow"></span>
    </button>
  </div>

  <!-- Bottom verse -->
  <p class="verse">
    "Some things are made with more than just code."
  </p>

  <!-- Starburst overlay -->
  <div id="starburst"></div>

  <!-- Page veil -->
  <div id="veil"></div>

  <script src="js/stars.js" defer></script>
  <script src="js/app.js" defer></script>
  <script>
    // Star config for index — warm stars, pink shooting stars, no clouds
    window.SKY_CONFIG = {
      starCount:      'auto',
      starColor:      [228, 218, 208],
      shootingStars:  true,
      shootColor:     [240, 192, 208],
      shootGlow:      true,
      cloudLayer:     false,
      starBrightness: 0.62,
    };

    // Corner date
    document.addEventListener('DOMContentLoaded', () => {
      const d = new Date();
      const months = ['Jan','Feb','Mar','Apr','May','Jun',
                      'Jul','Aug','Sep','Oct','Nov','Dec'];
      document.getElementById('cornerDate').textContent =
        `${months[d.getMonth()]} ${d.getFullYear()}`;
    });

    // Enter button
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('enterBtn').addEventListener('click', () => {
        window.navigateTo('password.html', 1100);
      });
    });
  </script>
</body>
</html>
