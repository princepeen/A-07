<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Music — Ashu</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#f2f0ed"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/animations.css"/>
  <style>
    /* ── music.html overrides: light warm-white/grey theme ── */
    html, body {
      overflow: hidden;
      background: #f2f0ed;
    }

    :root {
      --music-bg:        #f2f0ed;
      --music-surface:   rgba(200,196,192,0.18);
      --music-border:    rgba(180,175,170,0.25);
      --music-text:      #2a2724;
      --music-text-dim:  #9a9390;
      --music-text-mid:  #7a7370;
      --music-pink:      #d88da3;
      --music-pink-soft: #c97389;
      --music-line:      rgba(160,155,150,0.18);
      --player-h:        88px;
    }

    body { background: var(--music-bg); }

    /* override shared ambient layer for light theme */
    .ambient-base {
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%,  rgba(216,141,163,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 30% at 100% 60%, rgba(184,176,200,0.09) 0%, transparent 50%),
        radial-gradient(ellipse 60% 35% at 0% 70%,   rgba(200,190,180,0.07) 0%, transparent 50%);
    }

    /* ── Page ── */
    .page {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .m-header {
      flex-shrink: 0;
      padding: 3.2rem 1.6rem 0;
      opacity: 0;
      animation: rise 1.6s var(--ease-out) 0.3s forwards;
    }

    .back-btn {
      display: flex; align-items:center; gap:0.5rem;
      background:none; border:none; cursor:pointer;
      color: var(--music-text-dim);
      font-size: 0.54rem; font-weight:200; letter-spacing:0.35em; text-transform:uppercase;
      margin-bottom: 0.5rem;
      transition: color 0.3s ease;
    }
    .back-btn:hover { color: var(--music-text); }
    .back-arrow { width:7px; height:7px; border-left:1px solid currentColor; border-top:1px solid currentColor; transform:rotate(-45deg); }

    .m-title {
      font-family: var(--font-serif); font-weight:300;
      font-size: clamp(1.9rem, 7vw, 2.6rem);
      letter-spacing:0.06em; color: var(--music-text); line-height:1;
    }
    .m-sub {
      font-family: var(--font-serif); font-style:italic; font-size:0.82rem;
      color: var(--music-text-dim); margin-top:0.3rem; letter-spacing:0.05em;
    }

    .h-rule {
      height: 1px;
      background: linear-gradient(to right, var(--music-line), transparent);
      margin: 1.2rem 1.6rem 0;
      opacity: 0;
      animation: rise 1.4s ease 0.55s forwards;
    }

    /* ── Top song banner ── */
    .top-song {
      flex-shrink: 0;
      margin: 1rem 1.6rem 0;
      padding: 1rem 1.2rem;
      background: linear-gradient(135deg, rgba(216,141,163,0.18) 0%, rgba(220,215,225,0.12) 100%);
      border: 1px solid rgba(216,141,163,0.32);
      border-radius: 3px;
      display: flex; align-items:center; gap:1rem;
      cursor: pointer;
      transition: background 0.3s ease, border-color 0.3s ease;
      opacity: 0;
      animation: rise 1.6s var(--ease-out) 0.65s forwards;
      position: relative;
      overflow: hidden;
    }
    .top-song::before {
      content:''; position:absolute; top:0; left:0; right:0; height:1px;
      background: linear-gradient(to right, transparent, rgba(216,141,163,0.5), transparent);
    }
    .top-song:hover { background: linear-gradient(135deg, rgba(216,141,163,0.26) 0%, rgba(220,215,225,0.18) 100%); border-color: rgba(216,141,163,0.45); }
    .top-song.playing { border-color: rgba(216,141,163,0.5); }

    .top-song-badge {
      font-size:0.46rem; font-weight:200; letter-spacing:0.4em; text-transform:uppercase;
      color: var(--music-pink-soft); margin-bottom:0.25rem; display:block;
    }
    .top-song-name {
      font-family: var(--font-serif); font-weight:400; font-style:italic;
      font-size:1.15rem; color: var(--music-text); letter-spacing:0.03em; line-height:1.2;
    }
    .top-song-note {
      font-family: var(--font-serif); font-style:italic; font-size:0.78rem;
      color: var(--music-text-dim); margin-top:0.2rem; letter-spacing:0.03em;
    }

    .top-song-play {
      margin-left:auto; flex-shrink:0; width:38px; height:38px; border-radius:50%;
      background: rgba(216,141,163,0.14);
      border: 1px solid rgba(216,141,163,0.32);
      display:flex; align-items:center; justify-content:center;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }
    .top-song:hover .top-song-play,
    .top-song.playing .top-song-play {
      background: rgba(216,141,163,0.24);
      box-shadow: 0 0 16px rgba(216,141,163,0.22);
    }
    .play-icon { width:10px; height:12px; fill: var(--music-pink-soft); margin-left:2px; }
    .pause-icon { display:none; }
    .top-song.playing .play-icon { display:none; }
    .top-song.playing .pause-icon { display:block; }

    /* ── Column labels ── */
    .cols-label {
      flex-shrink:0; display:flex; padding:0.9rem 1.6rem 0; gap:1rem;
      opacity:0; animation: rise 1.4s ease 0.8s forwards;
    }
    .col-head {
      flex:1; font-size:0.5rem; font-weight:200; letter-spacing:0.42em; text-transform:uppercase;
      color: var(--music-text-dim); padding-bottom:0.5rem;
      border-bottom: 1px solid var(--music-line);
    }

    /* ── List ── */
    .list-wrap {
      flex:1; overflow-y:auto; overflow-x:hidden;
      padding: 0 1.6rem; padding-bottom: calc(var(--player-h) + 1.5rem);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      opacity:0; animation: rise 1.6s var(--ease-out) 0.9s forwards;
    }
    .list-wrap::-webkit-scrollbar { display:none; }

    .two-col {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem;
      padding-top: 0.6rem;
    }

    .song-row {
      display:flex; flex-direction:column; padding:0.75rem 0;
      border-bottom: 1px solid var(--music-line);
      cursor:pointer; transition: background 0.2s ease; border-radius:2px;
      position: relative;
    }
    .song-row:active { background: rgba(216,141,163,0.1); }
    .song-row.playing .song-name { color: var(--music-pink-soft); }
    .song-row.playing .song-note { color: rgba(216,141,163,0.65); }
    .song-row.playing::before {
      content:''; position:absolute; left:-8px; top:50%;
      transform: translateY(-50%);
      width:2px; height:60%;
      background: var(--music-pink);
      border-radius: 999px;
    }

    .song-name {
      font-family: var(--font-serif); font-weight:400; font-style:italic;
      font-size:0.92rem; color: var(--music-text); letter-spacing:0.02em; line-height:1.3;
      transition: color 0.25s ease;
    }
    .song-note {
      font-family: var(--font-serif); font-style:italic; font-size:0.66rem;
      color: var(--music-text-dim); margin-top:0.18rem; letter-spacing:0.02em; line-height:1.4;
      transition: color 0.25s ease;
    }

    /* ── Mini player ── */
    .player {
      position: fixed; bottom:0; left:0; right:0;
      height: var(--player-h); z-index:100;
      background: rgba(238,235,230,0.96);
      border-top: 1px solid rgba(216,141,163,0.28);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display:flex; flex-direction:column;
      padding: 0 1.4rem;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    .progress-wrap {
      height:2px; background: rgba(180,175,170,0.25);
      cursor:pointer; position:relative; margin:0 -1.4rem; flex-shrink:0;
    }
    .progress-fill {
      height:100%;
      background: linear-gradient(to right, rgba(216,141,163,0.75), var(--music-pink-soft));
      width:0%; transition: width 0.3s linear; position:relative;
    }
    .progress-fill::after {
      content:''; position:absolute; right:-3px; top:50%; transform:translateY(-50%);
      width:6px; height:6px; border-radius:50%;
      background: var(--music-pink-soft);
      box-shadow: 0 0 6px rgba(216,141,163,0.7);
    }

    .player-row { flex:1; display:flex; align-items:center; gap:1rem; }
    .player-info { flex:1; min-width:0; }
    .player-name {
      font-family: var(--font-serif); font-weight:400; font-style:italic;
      font-size:0.95rem; color: var(--music-text); letter-spacing:0.02em;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .player-note {
      font-family: var(--font-serif); font-style:italic; font-size:0.65rem;
      color: var(--music-text-dim); margin-top:0.1rem;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }

    .player-controls { display:flex; align-items:center; gap:1rem; flex-shrink:0; }
    .ctrl-btn {
      background:none; border:none; cursor:pointer; color: var(--music-text-mid);
      display:flex; align-items:center; justify-content:center;
      transition: color 0.25s ease, transform 0.2s ease; padding:4px;
    }
    .ctrl-btn:hover { color: var(--music-pink-soft); }
    .ctrl-btn:active { transform: scale(0.88); }

    .ctrl-play {
      width:40px; height:40px; border-radius:50%;
      background: linear-gradient(135deg, rgba(216,141,163,0.2) 0%, rgba(184,176,200,0.12) 100%);
      border: 1px solid rgba(216,141,163,0.32);
      color: var(--music-pink-soft);
      box-shadow: 0 0 14px rgba(216,141,163,0.18);
      transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
    }
    .ctrl-play:hover {
      background: linear-gradient(135deg, rgba(216,141,163,0.3) 0%, rgba(184,176,200,0.2) 100%);
      box-shadow: 0 0 22px rgba(216,141,163,0.3);
    }
    .ctrl-play:active { transform: scale(0.9); }

    .player-time {
      font-size:0.52rem; font-weight:200; letter-spacing:0.08em;
      color: var(--music-text-dim); flex-shrink:0; min-width:36px; text-align:right;
    }

    .eq { display:flex; align-items:flex-end; gap:2px; height:14px; flex-shrink:0; }
    .eq-bar {
      width:2.5px; background: var(--music-pink); border-radius:1px;
      animation: eqBounce 0.8s ease-in-out infinite; opacity:0;
    }
    .eq-bar:nth-child(1){animation-delay:0s; --h:6px;}
    .eq-bar:nth-child(2){animation-delay:0.15s; --h:12px;}
    .eq-bar:nth-child(3){animation-delay:0.3s; --h:8px;}
    .eq-bar:nth-child(4){animation-delay:0.1s; --h:10px;}
    .eq-bar.active { opacity:1; }

    @keyframes eqBounce { 0%,100%{height:3px;} 50%{height:var(--h);} }
  </style>
</head>
<body>

<canvas id="sky-canvas"></canvas>
<div class="ambient-base"></div>

<div class="page">

  <div class="m-header">
    <button class="back-btn" onclick="window.navigateTo('home.html')">
      <span class="back-arrow"></span><span>Home</span>
    </button>
    <h1 class="m-title">Late Night Radio</h1>
    <p class="m-sub">songs that sound like you</p>
  </div>

  <div class="h-rule"></div>

  <div class="top-song" id="topSong">
    <div style="flex:1;min-width:0;">
      <span class="top-song-badge">Tonight's Song</span>
      <div class="top-song-name">Goodnight</div>
      <div class="top-song-note">— Heyt</div>
    </div>
    <div class="top-song-play">
      <svg class="play-icon" viewBox="0 0 10 12"><polygon points="0,0 10,6 0,12"/></svg>
      <svg class="pause-icon" width="10" height="12" viewBox="0 0 10 12" fill="none">
        <rect x="0" y="0" width="3.5" height="12" rx="1" fill="currentColor"/>
        <rect x="6.5" y="0" width="3.5" height="12" rx="1" fill="currentColor"/>
      </svg>
    </div>
  </div>

  <div class="cols-label">
    <div class="col-head">Songs 1–16</div>
    <div class="col-head">Songs a–p</div>
  </div>

  <div class="list-wrap">
    <div class="two-col" id="songGrid"></div>
  </div>

</div>

<div class="player" id="player">
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="player-row">
    <div class="eq" id="eq">
      <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
    </div>
    <div class="player-info">
      <div class="player-name" id="pName">Select a song</div>
      <div class="player-note" id="pNote">—</div>
    </div>
    <div class="player-controls">
      <button class="ctrl-btn" id="prevBtn" title="Previous">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <polygon points="15,2 5,8 15,14"/><rect x="1" y="2" width="2.5" height="12" rx="1"/>
        </svg>
      </button>
      <button class="ctrl-btn ctrl-play" id="playBtn" title="Play/Pause">
        <svg id="playIcon" width="12" height="14" viewBox="0 0 10 12" fill="currentColor"><polygon points="0,0 10,6 0,12"/></svg>
        <svg id="pauseIcon" style="display:none" width="12" height="14" viewBox="0 0 10 12" fill="none">
          <rect x="0" y="0" width="3.5" height="12" rx="1" fill="currentColor"/>
          <rect x="6.5" y="0" width="3.5" height="12" rx="1" fill="currentColor"/>
        </svg>
      </button>
      <button class="ctrl-btn" id="nextBtn" title="Next">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <polygon points="1,2 11,8 1,14"/><rect x="12.5" y="2" width="2.5" height="12" rx="1"/>
        </svg>
      </button>
    </div>
    <div class="player-time" id="pTime">0:00</div>
  </div>
</div>

<div id="veil"></div>

<script src="js/stars.js" defer></script>
<script src="js/app.js"></script>
<script src="js/pwa.js" defer></script>
<script src="js/music.js" defer></script>
<script>
  // Light theme star config for music page
  window.SKY_CONFIG = {
    starCount:      'auto',
    starColor:      [160, 150, 145],
    shootingStars:  true,
    shootColor:     [216, 141, 163],
    shootGlow:      true,
    cloudLayer:     false,
    starBrightness: 0.35,
  };
</script>
</body>
</html>
