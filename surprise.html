<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Surprise — Ashu</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#0a0a0f"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/animations.css"/>
  <style>
    html, body { overflow: hidden; }

    .page {
      position: fixed; inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.8rem;
    }

    /* ── Back ── */
    .back-btn {
      position: fixed;
      top: max(1.8rem, env(safe-area-inset-top, 1.8rem));
      left: 1.6rem;
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: none; border: none; cursor: pointer;
      color: var(--text-dim);
      font-size: 0.54rem; font-weight: 200; letter-spacing: 0.35em; text-transform: uppercase;
      transition: color 0.3s ease;
      z-index: 20;
      opacity: 0;
      animation: rise 1.4s var(--ease-out) 0.2s forwards;
    }
    .back-btn:hover { color: var(--text-primary); }
    .back-arrow { width: 7px; height: 7px; border-left: 1px solid currentColor; border-top: 1px solid currentColor; transform: rotate(-45deg); }

    /* ── Center content ── */
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      text-align: center;
      max-width: 340px;
      width: 100%;
    }

    /* ── Eyebrow ── */
    .eyebrow {
      font-size: 0.54rem; font-weight: 200;
      letter-spacing: 0.44em; text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.9rem;
      opacity: 0;
      animation: rise 1.6s var(--ease-out) 0.4s forwards;
    }

    /* ── Title ── */
    .title {
      font-family: var(--font-serif);
      font-weight: 300;
      font-size: clamp(2.2rem, 9vw, 3.2rem);
      letter-spacing: 0.07em;
      line-height: 1.1;
      background: linear-gradient(155deg, #eae4dc 0%, #c8bdb4 42%, #b4aec4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0;
      animation: rise 2s var(--ease-out) 0.65s forwards;
    }

    /* ── Subtitle ── */
    .subtitle {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 0.86rem;
      color: var(--accent-lavender);
      letter-spacing: 0.06em;
      margin-top: 0.7rem;
      opacity: 0;
      animation: rise 1.8s var(--ease-out) 1s forwards;
    }

    /* ── Vertical rule ── */
    .v-rule {
      width: 1px; height: 48px;
      background: linear-gradient(to bottom, transparent, rgba(201,184,168,0.2), transparent);
      margin: 2rem 0 1.8rem;
      opacity: 0;
      animation: rise 1.6s ease 1.3s forwards;
    }

    /* ── Audio player card ── */
    .player-card {
      width: 100%;
      padding: 1.5rem 1.4rem;
      background: var(--bg-glass);
      border: 1px solid var(--glass-border);
      border-radius: 4px;
      backdrop-filter: blur(20px) saturate(130%);
      -webkit-backdrop-filter: blur(20px) saturate(130%);
      position: relative;
      overflow: hidden;
      opacity: 0;
      animation: rise 1.8s var(--ease-out) 1.55s forwards;
    }

    /* top shimmer line */
    .player-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(to right, transparent, rgba(232,180,192,0.35), transparent);
    }

    /* waveform visual (static decorative bars) */
    .waveform {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 36px;
      margin-bottom: 1.4rem;
    }

    .wave-bar {
      width: 2.5px;
      border-radius: 999px;
      background: rgba(232,180,192,0.25);
      transition: background 0.3s ease, height 0.15s ease;
    }

    /* animated waveform when playing */
    .playing .wave-bar {
      background: linear-gradient(to top, rgba(232,180,192,0.4), rgba(232,180,192,0.85));
      animation: wavePulse var(--spd, 0.8s) ease-in-out infinite alternate;
    }

    @keyframes wavePulse {
      from { height: var(--min-h, 6px); }
      to   { height: var(--max-h, 28px); }
    }

    /* ── Progress bar ── */
    .progress-wrap {
      width: 100%;
      height: 2px;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      cursor: pointer;
      margin-bottom: 0.7rem;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(to right, rgba(232,180,192,0.6), rgba(232,180,192,1));
      width: 0%;
      transition: width 0.25s linear;
      position: relative;
    }
    .progress-fill::after {
      content: '';
      position: absolute;
      right: -4px; top: 50%;
      transform: translateY(-50%);
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(232,180,192,1);
      box-shadow: 0 0 8px rgba(232,180,192,0.7);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .playing .progress-fill::after { opacity: 1; }

    /* time row */
    .time-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1.4rem;
    }
    .time-label {
      font-size: 0.5rem; font-weight: 200;
      letter-spacing: 0.06em; color: var(--text-dim);
    }

    /* ── Main play button ── */
    .play-row {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn {
      width: 58px; height: 58px;
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(232,180,192,0.18) 0%, rgba(184,176,200,0.1) 100%);
      border: 1px solid rgba(232,180,192,0.35);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow:
        0 0 24px rgba(232,180,192,0.14),
        inset 0 1px 0 rgba(255,255,255,0.07);
      transition: background 0.35s ease, box-shadow 0.35s ease, transform 0.2s var(--ease-out), border-color 0.35s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .play-btn:hover {
      background: linear-gradient(145deg, rgba(232,180,192,0.28) 0%, rgba(184,176,200,0.18) 100%);
      box-shadow: 0 0 36px rgba(232,180,192,0.28), inset 0 1px 0 rgba(255,255,255,0.1);
      border-color: rgba(232,180,192,0.55);
    }
    .play-btn:active { transform: scale(0.93); }

    .play-icon  { fill: rgba(232,180,192,0.9); }
    .pause-icon { fill: rgba(232,180,192,0.9); display: none; }

    .playing .play-icon  { display: none; }
    .playing .pause-icon { display: block; }

    /* ── Bottom caption ── */
    .caption {
      position: fixed;
      bottom: max(2.2rem, env(safe-area-inset-bottom, 2.2rem));
      left: 0; right: 0;
      text-align: center;
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 0.78rem;
      color: var(--text-dim);
      letter-spacing: 0.04em;
      opacity: 0;
      animation: rise 2s ease 2.2s forwards;
      z-index: 10;
      padding: 0 2rem;
    }
  </style>
</head>
<body>

<canvas id="sky-canvas"></canvas>
<div class="ambient-base"></div>

<button class="back-btn" onclick="window.navigateTo('home.html')">
  <span class="back-arrow"></span><span>Home</span>
</button>

<div class="page">
  <div class="content">

    <span class="eyebrow">just for you</span>
    <h1 class="title">A Few Words<br>For You</h1>
    <p class="subtitle">press play when you're ready</p>

    <div class="v-rule"></div>

    <!-- Audio player -->
    <div class="player-card" id="playerCard">

      <!-- Waveform -->
      <div class="waveform" id="waveform"></div>

      <!-- Progress -->
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-row">
        <span class="time-label" id="tCurrent">0:00</span>
        <span class="time-label" id="tDuration">—:——</span>
      </div>

      <!-- Play button -->
      <div class="play-row">
        <button class="play-btn" id="playBtn" aria-label="Play / Pause">
          <svg class="play-icon" width="18" height="20" viewBox="0 0 10 12">
            <polygon points="0,0 10,6 0,12"/>
          </svg>
          <svg class="pause-icon" width="18" height="20" viewBox="0 0 10 12" fill="none">
            <rect x="0"   y="0" width="3.5" height="12" rx="1" fill="rgba(232,180,192,0.9)"/>
            <rect x="6.5" y="0" width="3.5" height="12" rx="1" fill="rgba(232,180,192,0.9)"/>
          </svg>
        </button>
      </div>

    </div>
  </div>
</div>

<p class="caption">"Happy Birthday, Ashu. This one's from the heart."</p>

<div id="starburst"></div>
<div id="veil"></div>

<script src="js/stars.js" defer></script>
<script src="js/app.js" defer></script>
<script>
  window.SKY_CONFIG = {
    starCount:      'auto',
    starColor:      [225, 215, 205],
    shootingStars:  true,
    shootColor:     [232, 180, 192],
    shootGlow:      true,
    cloudLayer:     false,
    starBrightness: 0.55,
  };

  document.addEventListener('DOMContentLoaded', () => {
    const audio      = new Audio('audio/surprise.mp3');
    const card       = document.getElementById('playerCard');
    const playBtn    = document.getElementById('playBtn');
    const progWrap   = document.getElementById('progressWrap');
    const progFill   = document.getElementById('progressFill');
    const tCurrent   = document.getElementById('tCurrent');
    const tDuration  = document.getElementById('tDuration');
    const waveform   = document.getElementById('waveform');

    /* ── Build waveform bars ── */
    const BAR_COUNT = 36;
    const barHeights = [8,12,18,24,30,28,22,14,10,16,26,32,28,20,12,8,14,22,30,34,28,18,10,14,24,32,28,20,12,8,16,22,28,24,16,10];
    for (let i = 0; i < BAR_COUNT; i++) {
      const bar = document.createElement('div');
      bar.className = 'wave-bar';
      const maxH = barHeights[i % barHeights.length];
      const minH = Math.max(3, Math.round(maxH * 0.22));
      bar.style.height  = minH + 'px';
      bar.style.setProperty('--max-h', maxH + 'px');
      bar.style.setProperty('--min-h', minH + 'px');
      bar.style.setProperty('--spd', (0.55 + Math.random() * 0.55).toFixed(2) + 's');
      bar.style.animationDelay = (i * 0.028).toFixed(2) + 's';
      waveform.appendChild(bar);
    }

    /* ── Time format ── */
    function fmt(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    /* ── Audio events ── */
    audio.addEventListener('loadedmetadata', () => {
      tDuration.textContent = fmt(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      progFill.style.width = pct + '%';
      tCurrent.textContent = fmt(audio.currentTime);
    });

    audio.addEventListener('ended', () => {
      card.classList.remove('playing');
      progFill.style.width = '0%';
      tCurrent.textContent = '0:00';
      audio.currentTime = 0;
    });

    /* ── Play / pause ── */
    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().catch(() => {});
        card.classList.add('playing');
        /* pause background music while this plays */
        if (window.bgMusic && !window.bgMusic.paused) {
          window.bgMusic.pause();
          window._bgWasPaused = false;
        } else {
          window._bgWasPaused = true;
        }
      } else {
        audio.pause();
        card.classList.remove('playing');
        /* resume background music */
        if (!window._bgWasPaused && window.bgMusic) {
          window.bgMusic.play().catch(() => {});
        }
      }
    });

    /* ── Scrub ── */
    progWrap.addEventListener('click', e => {
      if (!audio.duration) return;
      const r = progWrap.getBoundingClientRect();
      audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
    });

    /* ── Resume bg music when leaving ── */
    window.addEventListener('beforeunload', () => {
      if (!audio.paused && window.bgMusic) {
        window.bgMusic.play().catch(() => {});
      }
    });
  });
</script>
</body>
    </html>
