<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Date Ideas — Ashu</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#f5f3f0"/>
<link rel="stylesheet" href="css/style.css"/>
<link rel="stylesheet" href="css/animations.css"/>
<style>
  /* ── dateideas-specific layout ── */
  html, body { overflow-x: hidden; }

  /* Floating fog particles */
  .fog-particle {
    position: fixed;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(200,195,215,0.5) 0%, rgba(200,195,215,0) 70%);
    pointer-events: none;
    z-index: 1;
    filter: blur(2px);
  }

  /* page */
  .page {
    min-height: 100vh;
    padding: 3.2rem 1.4rem 3.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* header */
  .header { text-align: center; margin-bottom: 2.4rem; opacity:0; animation: rise 1.6s var(--ease-out) 0.2s forwards; }
  .back-btn {
    display: inline-flex; align-items:center; gap:0.5rem;
    background:none; border:none; cursor:pointer;
    color: var(--text-dim);
    font-size: 0.54rem; font-weight:200; letter-spacing:0.35em; text-transform:uppercase;
    margin-bottom: 1.6rem;
    transition: color 0.3s ease;
  }
  .back-btn:hover { color: var(--text-primary); }
  .back-arrow { width:7px; height:7px; border-left:1px solid currentColor; border-top:1px solid currentColor; transform:rotate(-45deg); }

  .title {
    font-family: var(--font-serif); font-weight:300;
    font-size: clamp(2.1rem, 8vw, 2.8rem);
    letter-spacing:0.06em; color: var(--text-primary); line-height:1;
  }
  .subtitle {
    font-family: var(--font-serif); font-style:italic; font-size:0.86rem;
    color: var(--accent-lavender); margin-top:0.5rem; letter-spacing:0.04em;
  }

  /* card grid */
  .card-grid {
    width: 100%;
    max-width: 480px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.9rem;
  }

  .idea-card {
    position: relative;
    aspect-ratio: 1 / 1.05;
    border-radius: 4px;
    background: var(--bg-glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(16px) saturate(120%);
    -webkit-backdrop-filter: blur(16px) saturate(120%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.7rem;
    padding: 1.2rem;
    cursor: pointer;
    overflow: hidden;
    opacity: 0;
    transform: translateY(20px);
    animation: cardRise 0.9s var(--ease-out) forwards;
    transition: transform 0.45s var(--ease-out), background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    will-change: transform;
  }
  .idea-card:nth-child(1) { animation-delay: 0.35s; }
  .idea-card:nth-child(2) { animation-delay: 0.45s; }
  .idea-card:nth-child(3) { animation-delay: 0.55s; }
  .idea-card:nth-child(4) { animation-delay: 0.65s; }
  .idea-card:nth-child(5) { animation-delay: 0.75s; }
  .idea-card:nth-child(6) { animation-delay: 0.85s; }

  .idea-card::before {
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(160deg, rgba(255,255,255,0.05) 0%, transparent 55%);
    pointer-events:none;
  }

  .idea-card:hover {
    transform: translateY(-5px);
    background: var(--bg-glass-hover);
    border-color: rgba(201,184,168,0.25);
    box-shadow: 0 14px 36px rgba(0,0,0,0.35), 0 0 24px rgba(184,176,200,0.06);
  }
  .idea-card:active { transform: translateY(-2px) scale(0.98); }

  .card-icon {
    font-size: 1.6rem;
    opacity: 0.85;
    filter: grayscale(0.3) brightness(1.1);
    position: relative; z-index:1;
  }

  .card-label {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 0.92rem;
    color: var(--text-primary);
    letter-spacing: 0.03em;
    text-align: center;
    position: relative; z-index:1;
  }

  .card-hint {
    font-size: 0.46rem;
    font-weight: 200;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--text-dim);
    position: relative; z-index:1;
    transition: color 0.3s ease;
  }
  .idea-card:hover .card-hint { color: var(--accent-warm); }

  /* footer note */
  .footer-note {
    margin-top: 2.6rem;
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 0.8rem;
    color: var(--text-dim);
    text-align: center;
    max-width: 320px;
    line-height: 1.7;
    opacity: 0;
    animation: rise 1.8s ease 1.1s forwards;
  }

  /* modal */
  .dateideas-modal-overlay {
    position: fixed; inset:0; z-index: 800;
    display: flex; align-items:flex-end; justify-content:center;
    background: rgba(6,6,10,0.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s var(--ease-soft);
  }
  .dateideas-modal-overlay.open { opacity:1; pointer-events:all; }

  .dateideas-modal-box {
    width: 100%;
    max-width: 480px;
    max-height: 88vh;
    background: rgba(16,15,20,0.88);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 18px 18px 0 0;
    backdrop-filter: blur(24px) saturate(130%);
    -webkit-backdrop-filter: blur(24px) saturate(130%);
    padding: 1.6rem 1.5rem 2.2rem;
    overflow-y: auto;
    transform: translateY(100%) scale(0.98);
    transition: transform 0.5s var(--ease-out);
    box-shadow: 0 -20px 60px rgba(0,0,0,0.5);
  }
  .dateideas-modal-overlay.open .dateideas-modal-box { transform: translateY(0) scale(1); }

  .modal-handle {
    width: 36px; height: 3px;
    background: rgba(255,255,255,0.18);
    border-radius: 999px;
    margin: 0 auto 1.4rem;
  }

  .modal-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 0.4rem;
  }

  .modal-icon { font-size: 1.5rem; opacity:0.85; filter: grayscale(0.3) brightness(1.1); }

  .modal-close {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items:center; justify-content:center;
    cursor: pointer;
    color: var(--text-dim);
    transition: background 0.3s ease, color 0.3s ease, transform 0.2s ease;
    flex-shrink: 0;
  }
  .modal-close:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }
  .modal-close:active { transform: scale(0.9); }

  .modal-title {
    font-family: var(--font-serif);
    font-weight: 300;
    font-size: 1.7rem;
    color: var(--text-primary);
    letter-spacing: 0.04em;
    margin-top: 0.6rem;
  }

  .modal-note {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 0.92rem;
    color: var(--accent-lavender);
    line-height: 1.75;
    letter-spacing: 0.02em;
    margin-top: 0.8rem;
    margin-bottom: 1.6rem;
    white-space: pre-line;
  }

  /* image grid */
  .img-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.55rem;
    margin-bottom: 1.8rem;
  }
  .img-cell {
    aspect-ratio: 1 / 1;
    border-radius: 6px;
    overflow: hidden;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    position: relative;
  }
  .img-cell img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .img-cell img.loaded { opacity: 1; }
  .img-cell .ph {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size: 0.46rem; letter-spacing:0.15em; text-transform:uppercase;
    color: var(--text-dim);
    background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
  }

  /* ask button */
  .ask-btn {
    width: 100%;
    padding: 1rem;
    border-radius: 8px;
    background: linear-gradient(135deg, rgba(201,184,168,0.12) 0%, rgba(184,176,200,0.08) 100%);
    border: 1px solid rgba(201,184,168,0.25);
    color: #ffffff;
    font-family: var(--font-sans);
    font-size: 0.62rem;
    font-weight: 300;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.35s ease, border-color 0.35s ease, transform 0.2s ease, box-shadow 0.35s ease;
    position: relative;
    overflow: hidden;
  }
  .ask-btn:hover {
    background: linear-gradient(135deg, rgba(201,184,168,0.2) 0%, rgba(184,176,200,0.14) 100%);
    border-color: rgba(201,184,168,0.4);
    box-shadow: 0 0 24px rgba(201,184,168,0.12);
  }
  .ask-btn:active { transform: scale(0.97); }

  /* confirm toast */
  .confirm-toast {
    text-align: center;
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 0.88rem;
    color: var(--accent-warm);
    margin-top: 0.9rem;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    height: 0;
    overflow: hidden;
  }
  .confirm-toast.show {
    opacity: 1;
    transform: translateY(0);
    height: auto;
  }

  @keyframes cardRise {
    from { opacity:0; transform:translateY(20px); }
    to   { opacity:1; transform:translateY(0); }
  }
</style>
</head>
<body>

<canvas id="sky-canvas"></canvas>
<div class="ambient-base"></div>
<div id="fogContainer"></div>

<div class="page">

  <div class="header">
    <button class="back-btn" onclick="window.navigateTo('home.html')">
      <span class="back-arrow"></span><span>Home</span>
    </button>
    <div class="eyebrow">future memories</div>
    <h1 class="title">Date Ideas</h1>
    <p class="subtitle">places I'd love to take you</p>
  </div>

  <div class="card-grid" id="cardGrid"></div>

  <p class="footer-note">"Some of these are just dreams for now. But I'd like to make every one of them real, with you."</p>

</div>

<!-- Modal -->
<div class="dateideas-modal-overlay" id="modalOverlay">
  <div class="dateideas-modal-box">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div>
        <span class="modal-icon" id="modalIcon"></span>
        <h2 class="modal-title" id="modalTitle"></h2>
      </div>
      <button class="modal-close" id="modalClose" aria-label="Close">
        <svg width="13" height="13" viewBox="0 0 13 13"><path d="M1 1L12 12M12 1L1 12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <p class="modal-note" id="modalNote"></p>
    <div class="img-grid" id="modalImgGrid"></div>
    <button class="ask-btn" id="askBtn">Would you go on this date with me?</button>
    <p class="confirm-toast" id="confirmToast">I'll remember that ❤</p>
  </div>
</div>

<div id="starburst"></div>
<div id="veil"></div>

<script src="js/stars.js" defer></script>
<script src="js/app.js" defer></script>
<script src="js/pwa.js"></script>
<script src="js/dateideas.js" defer></script>
<script>
  window.SKY_CONFIG = {
    starCount:      'auto',
    starColor:      [225, 215, 205],
    shootingStars:  true,
    shootColor:     [232, 180, 192],
    shootGlow:      true,
    cloudLayer:     false,
    starBrightness: 0.55,
  };
</script>
</body>
  </html>
