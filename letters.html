<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Letters — Ashu</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#f5f3f0"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/animations.css"/>
  <style>
    html, body { overflow-x: hidden; }

    .page {
      min-height: 100vh;
      padding: 3.2rem 1.5rem 4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 2.8rem;
      opacity: 0;
      animation: rise 1.6s var(--ease-out) 0.2s forwards;
    }

    .back-btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: none; border: none; cursor: pointer;
      color: var(--text-dim);
      font-size: 0.54rem; font-weight: 200; letter-spacing: 0.35em; text-transform: uppercase;
      margin-bottom: 1.5rem;
      transition: color 0.3s ease;
    }
    .back-btn:hover { color: var(--text-primary); }
    .back-arrow { width: 7px; height: 7px; border-left: 1px solid currentColor; border-top: 1px solid currentColor; transform: rotate(-45deg); }

    .header-title {
      font-family: var(--font-serif);
      font-weight: 300;
      font-size: clamp(2rem, 8vw, 2.8rem);
      letter-spacing: 0.06em;
      color: var(--text-primary);
      line-height: 1;
    }
    .header-sub {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 0.84rem;
      color: var(--accent-lavender);
      margin-top: 0.5rem;
      letter-spacing: 0.04em;
    }

    /* ── Letter list ── */
    .letters-list {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    /* ── Single envelope card ── */
    .envelope-card {
      position: relative;
      width: 100%;
      cursor: pointer;
      opacity: 0;
      animation: rise 1s var(--ease-out) forwards;
      -webkit-tap-highlight-color: transparent;
    }

    /* stagger delays */
    .envelope-card:nth-child(1) { animation-delay: 0.35s; }
    .envelope-card:nth-child(2) { animation-delay: 0.48s; }
    .envelope-card:nth-child(3) { animation-delay: 0.61s; }
    .envelope-card:nth-child(4) { animation-delay: 0.74s; }
    .envelope-card:nth-child(5) { animation-delay: 0.87s; }
    .envelope-card:nth-child(6) { animation-delay: 1.00s; }
    .envelope-card:nth-child(7) { animation-delay: 1.13s; }

    .envelope-inner {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      padding: 1.1rem 1.3rem;
      background: var(--bg-glass);
      border: 1px solid var(--glass-border);
      border-radius: 3px;
      backdrop-filter: blur(16px) saturate(120%);
      -webkit-backdrop-filter: blur(16px) saturate(120%);
      transition: background 0.4s ease, border-color 0.4s ease, transform 0.4s var(--ease-out), box-shadow 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    /* gloss sheen */
    .envelope-inner::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 40%;
      background: linear-gradient(180deg, rgba(255,255,255,0.045) 0%, transparent 100%);
      pointer-events: none;
    }

    .envelope-card:hover .envelope-inner {
      background: var(--bg-glass-hover);
      border-color: rgba(232,180,192,0.22);
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.3), 0 0 20px rgba(232,180,192,0.06);
    }
    .envelope-card:active .envelope-inner { transform: scale(0.98); }

    /* envelope SVG icon */
    .env-icon {
      flex-shrink: 0;
      width: 42px; height: 32px;
      position: relative;
    }

    .env-icon svg { width: 100%; height: 100%; }

    /* envelope flap opens on hover */
    .env-flap {
      transform-origin: top center;
      transform: rotateX(0deg);
      transition: transform 0.45s var(--ease-out);
    }
    .envelope-card:hover .env-flap { transform: rotateX(-165deg); }

    /* letter number badge */
    .env-number {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--font-serif);
      font-size: 0.65rem;
      font-weight: 300;
      color: var(--accent-lavender);
      opacity: 0.7;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .envelope-card:hover .env-number { opacity: 0; }

    /* text info */
    .env-info { flex: 1; min-width: 0; }

    .env-title {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 400;
      font-size: 0.98rem;
      color: var(--text-primary);
      letter-spacing: 0.02em;
      line-height: 1.3;
    }

    .env-hint {
      font-size: 0.5rem;
      font-weight: 200;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 0.3rem;
      transition: color 0.35s ease;
    }
    .envelope-card:hover .env-hint { color: var(--accent-pink); }

    /* arrow */
    .env-arrow {
      flex-shrink: 0;
      width: 7px; height: 7px;
      border-right: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border);
      transform: rotate(45deg);
      transition: border-color 0.35s ease, transform 0.4s var(--ease-out);
    }
    .envelope-card:hover .env-arrow {
      border-color: rgba(232,180,192,0.5);
      transform: rotate(45deg) translate(2px,-2px);
    }

    /* ── Full-screen letter modal ── */
    .letter-overlay {
      position: fixed; inset: 0; z-index: 800;
      display: flex; align-items: flex-end; justify-content: center;
      background: rgba(6,6,10,0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.45s ease;
    }
    .letter-overlay.open { opacity: 1; pointer-events: all; }

    .letter-sheet {
      width: 100%;
      max-width: 520px;
      max-height: 92vh;
      background: rgba(13,12,18,0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px 20px 0 0;
      overflow-y: auto;
      overflow-x: hidden;
      transform: translateY(100%);
      transition: transform 0.55s var(--ease-out);
      box-shadow: 0 -24px 70px rgba(0,0,0,0.55);
      scrollbar-width: none;
    }
    .letter-sheet::-webkit-scrollbar { display: none; }
    .letter-overlay.open .letter-sheet { transform: translateY(0); }

    /* handle */
    .sheet-handle {
      width: 36px; height: 3px;
      background: rgba(255,255,255,0.15);
      border-radius: 999px;
      margin: 1.2rem auto 0;
    }

    /* letter image fills the top */
    .letter-img-wrap {
      width: 100%;
      padding: 1.4rem 1.4rem 0;
    }

    .letter-img {
      width: 100%;
      border-radius: 10px;
      display: block;
      opacity: 0;
      transition: opacity 0.6s ease;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .letter-img.loaded { opacity: 1; }

    /* img placeholder shimmer */
    .letter-img-ph {
      width: 100%;
      aspect-ratio: 3/4;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015));
      border: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 0.78rem;
      color: var(--text-dim);
      letter-spacing: 0.05em;
    }
    .letter-img-ph.hidden { display: none; }

    /* letter footer */
    .letter-footer {
      padding: 1.4rem 1.4rem 2.4rem;
    }

    .letter-title {
      font-family: var(--font-serif);
      font-weight: 300;
      font-size: 1.5rem;
      color: var(--text-primary);
      letter-spacing: 0.04em;
      margin-bottom: 0.4rem;
    }

    .letter-num {
      font-size: 0.5rem;
      font-weight: 200;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 1rem;
      display: block;
    }

    .letter-close {
      margin-top: 1.4rem;
      width: 100%;
      padding: 0.95rem;
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-dim);
      font-family: var(--font-sans);
      font-size: 0.56rem;
      font-weight: 200;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }
    .letter-close:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.14); color: var(--text-primary); }
  </style>
</head>
<body>

<canvas id="sky-canvas"></canvas>
<div class="ambient-base"></div>

<div class="page">

  <div class="header">
    <button class="back-btn" onclick="window.navigateTo('home.html')">
      <span class="back-arrow"></span><span>Home</span>
    </button>
    <h1 class="header-title">Letters</h1>
    <p class="header-sub">written for the moments you need them most</p>
  </div>

  <div class="letters-list" id="lettersList"></div>

</div>

<!-- Letter modal -->
<div class="letter-overlay" id="letterOverlay">
  <div class="letter-sheet" id="letterSheet">
    <div class="sheet-handle"></div>
    <div class="letter-img-wrap">
      <div class="letter-img-ph" id="letterPh">opening…</div>
      <img class="letter-img" id="letterImg" alt="" src=""/>
    </div>
    <div class="letter-footer">
      <span class="letter-num" id="letterNum"></span>
      <h2 class="letter-title" id="letterTitle"></h2>
      <button class="letter-close" id="letterClose">close letter</button>
    </div>
  </div>
</div>

<div id="starburst"></div>
<div id="veil"></div>

<script src="js/stars.js" defer></script>
<script src="js/app.js" defer></script>
<script src="js/pwa.js" defer></script>
<script>
  window.SKY_CONFIG = {
    starCount:      'auto',
    starColor:      [225, 215, 205],
    shootingStars:  true,
    shootColor:     [232, 180, 192],
    shootGlow:      true,
    cloudLayer:     false,
    starBrightness: 0.55,
  };

  /* ── Letter data ── */
  const LETTERS = [
    { num: 1, file: 'img/1.jpg', title: 'Open when you had a bad day' },
    { num: 2, file: 'img/2.jpg', title: 'To your future self' },
    { num: 3, file: 'img/3.jpg', title: 'Small things you do' },
    { num: 4, file: 'img/4.jpg', title: 'Open when it\'s raining' },
    { num: 5, file: 'img/5.jpg', title: 'Open when you need a hug' },
    { num: 6, file: 'img/6.jpg', title: 'Open when you\'re listening to your favourite song' },
    { num: 7, file: 'img/7.jpg', title: 'Things that remind me of you' },
  ];

  /* ── Build list ── */
  function buildEnvelopeSVG() {
    return `
      <svg viewBox="0 0 52 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- body -->
        <rect x="1" y="8" width="50" height="31" rx="2"
          fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        <!-- bottom fold lines -->
        <path d="M1 38 L26 22 L51 38" stroke="rgba(255,255,255,0.07)" stroke-width="0.8"/>
        <!-- left and right side folds -->
        <path d="M1 9 L21 24" stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>
        <path d="M51 9 L31 24" stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>
        <!-- flap (opens on hover via CSS) -->
        <path class="env-flap"
          d="M1 8 L26 26 L51 8 Q51 6 49 6 L3 6 Q1 6 1 8Z"
          fill="rgba(184,176,200,0.08)" stroke="rgba(184,176,200,0.15)" stroke-width="0.8"/>
        <!-- wax seal dot -->
        <circle cx="26" cy="24" r="3.5" fill="rgba(232,180,192,0.18)" stroke="rgba(232,180,192,0.3)" stroke-width="0.7"/>
      </svg>
    `;
  }

  document.addEventListener('DOMContentLoaded', () => {
    const list = document.getElementById('lettersList');

    LETTERS.forEach(l => {
      const card = document.createElement('div');
      card.className = 'envelope-card';
      card.innerHTML = `
        <div class="envelope-inner">
          <div class="env-icon">
            ${buildEnvelopeSVG()}
            <span class="env-number">${l.num}</span>
          </div>
          <div class="env-info">
            <div class="env-title">${l.title}</div>
            <div class="env-hint">tap to open</div>
          </div>
          <div class="env-arrow"></div>
        </div>
      `;
      card.addEventListener('click', () => openLetter(l));
      list.appendChild(card);
    });

    /* ── Modal logic ── */
    const overlay    = document.getElementById('letterOverlay');
    const sheet      = document.getElementById('letterSheet');
    const imgEl      = document.getElementById('letterImg');
    const phEl       = document.getElementById('letterPh');
    const titleEl    = document.getElementById('letterTitle');
    const numEl      = document.getElementById('letterNum');

    function openLetter(l) {
      numEl.textContent  = `Letter ${l.num} of ${LETTERS.length}`;
      titleEl.textContent = l.title;

      // reset image
      imgEl.classList.remove('loaded');
      imgEl.src = '';
      phEl.classList.remove('hidden');
      phEl.textContent = 'opening…';

      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
      sheet.scrollTop = 0;

      // load image
      imgEl.onload  = () => { imgEl.classList.add('loaded'); phEl.classList.add('hidden'); };
      imgEl.onerror = () => { phEl.textContent = 'letter coming soon'; };
      imgEl.src = l.file;
    }

    function closeLetter() {
      overlay.classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('letterClose').addEventListener('click', closeLetter);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeLetter(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLetter(); });

    // swipe down to close
    let ty0 = 0;
    sheet.addEventListener('touchstart', e => { ty0 = e.touches[0].clientY; }, { passive: true });
    sheet.addEventListener('touchend',   e => {
      if (e.changedTouches[0].clientY - ty0 > 80 && sheet.scrollTop === 0) closeLetter();
    }, { passive: true });
  });
</script>
</body>
  </html>
