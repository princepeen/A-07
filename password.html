<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Enter — Ashu</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#f5f3f0"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/animations.css"/>
  <style>
    html, body { overflow: hidden; }

    :root {
      --slot-empty:  rgba(255,255,255,0.05);
      --slot-filled: rgba(232,180,192,0.18);
    }

    .page {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 0 1.6rem;
      gap: 0;
    }

    /* eyebrow */
    .eyebrow {
      font-size: 0.54rem; font-weight: 200;
      letter-spacing: 0.44em; text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 2rem;
      opacity: 0; animation: rise 1.4s var(--ease-out) 0.2s forwards;
    }

    /* slots */
    .slots {
      display: flex; gap: 1rem;
      margin-bottom: 2.6rem;
      opacity: 0; animation: rise 1.6s var(--ease-out) 0.45s forwards;
    }

    .slot {
      width: 52px; height: 52px; border-radius: 3px;
      background: var(--slot-empty);
      border: 1px solid rgba(255,255,255,0.07);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      position: relative; overflow: hidden;
    }
    .slot::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 60%);
    }
    .slot.filled {
      background: var(--slot-filled);
      border-color: rgba(232,180,192,0.35);
      box-shadow: 0 0 14px rgba(232,180,192,0.18), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .slot-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: rgba(240,204,214,1);
      box-shadow: 0 0 10px rgba(232,180,192,0.8);
      opacity: 0; transform: scale(0);
      transition: opacity 0.25s ease, transform 0.35s var(--ease-out);
    }
    .slot.filled .slot-dot { opacity: 1; transform: scale(1); }

    /* keypad */
    .keypad {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem; width: 100%; max-width: 280px;
      opacity: 0; animation: rise 1.6s var(--ease-out) 0.7s forwards;
    }

    .key {
      position: relative; height: 68px; border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.12);
      background: linear-gradient(160deg, rgba(72,68,80,0.55) 0%, rgba(38,35,48,0.65) 100%);
      cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; overflow: hidden;
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.18s var(--ease-out), box-shadow 0.3s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.07);
      -webkit-tap-highlight-color: transparent;
    }

    /* gloss */
    .key::before {
      content: ''; position: absolute; top:0; left:0; right:0; height:45%;
      background: linear-gradient(180deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.02) 100%);
      border-radius: 4px 4px 0 0; pointer-events: none;
    }

    .key:hover {
      background: linear-gradient(160deg, rgba(100,80,95,0.65) 0%, rgba(70,55,75,0.72) 100%);
      border-color: rgba(232,180,192,0.35);
      box-shadow: 0 0 22px rgba(232,180,192,0.18), 0 0 8px rgba(232,180,192,0.1), inset 0 1px 0 rgba(255,255,255,0.09);
    }
    .key:active, .key.pressed {
      transform: scale(0.93);
      background: linear-gradient(160deg, rgba(120,88,105,0.72) 0%, rgba(85,62,82,0.80) 100%);
      border-color: rgba(232,180,192,0.55);
      box-shadow: 0 0 32px rgba(232,180,192,0.28), 0 0 12px rgba(232,180,192,0.18), inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .key-num {
      font-family: var(--font-sans); font-weight: 300; font-size: 1.3rem;
      color: var(--text-primary); letter-spacing: 0.02em; line-height: 1;
      position: relative; z-index:1;
      transition: color 0.25s ease;
    }
    .key:hover .key-num { color: rgba(240,204,214,1); }
    .key:active .key-num, .key.pressed .key-num { color: #fff; }

    .key-sub {
      font-size: 0.38rem; font-weight: 200; letter-spacing: 0.22em;
      color: var(--text-dim); text-transform: uppercase;
      position: relative; z-index:1;
      transition: color 0.25s ease;
    }
    .key:hover .key-sub { color: rgba(232,180,192,0.5); }

    /* special keys */
    .key.special .key-num {
      font-size: 0.58rem; font-weight: 200; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--text-dim);
    }
    .key.special:hover .key-num { color: rgba(240,204,214,1); }

    /* enter key */
    .key.enter-key {
      background: linear-gradient(160deg, rgba(110,72,88,0.6) 0%, rgba(75,48,68,0.7) 100%);
      border-color: rgba(232,180,192,0.28);
      box-shadow: 0 0 16px rgba(232,180,192,0.12), inset 0 1px 0 rgba(255,255,255,0.07);
    }
    .key.enter-key .key-num { color: rgba(232,180,192,1); font-size: 0.58rem; font-weight: 300; letter-spacing: 0.3em; text-transform: uppercase; }
    .key.enter-key:hover {
      background: linear-gradient(160deg, rgba(145,88,110,0.68) 0%, rgba(100,62,88,0.76) 100%);
      border-color: rgba(232,180,192,0.5);
      box-shadow: 0 0 28px rgba(232,180,192,0.25), 0 0 10px rgba(232,180,192,0.15);
    }
    .key.enter-key.pressed {
      background: linear-gradient(160deg, rgba(165,100,125,0.75) 0%, rgba(115,72,100,0.82) 100%);
      border-color: rgba(232,180,192,0.68);
      box-shadow: 0 0 40px rgba(232,180,192,0.35), 0 0 16px rgba(232,180,192,0.22);
    }

    /* wrong popup */
    .popup-overlay {
      position: fixed; inset: 0; z-index: 500;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .popup-overlay.open { opacity: 1; pointer-events: all; }

    .popup {
      width: min(82vw, 320px); padding: 2rem 1.8rem;
      background: rgba(18,14,20,0.82);
      border: 1px solid rgba(232,180,192,0.18); border-radius: 4px;
      text-align: center;
      backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 0 40px rgba(232,180,192,0.1), 0 24px 60px rgba(0,0,0,0.5);
      transform: scale(0.92) translateY(8px);
      transition: transform 0.4s var(--ease-out);
    }
    .popup-overlay.open .popup { transform: scale(1) translateY(0); }

    .popup-text {
      font-family: var(--font-serif); font-style: italic; font-weight: 300;
      font-size: 1.05rem; color: rgba(240,204,214,1); letter-spacing: 0.04em; line-height: 1.6;
    }
    .popup-sub {
      margin-top: 0.6rem; font-size: 0.54rem; font-weight: 200;
      letter-spacing: 0.3em; text-transform: uppercase; color: var(--text-dim);
    }

    @keyframes slotShake {
      0%,100%{transform:translateX(0);} 18%{transform:translateX(-7px);}
      36%{transform:translateX(7px);} 54%{transform:translateX(-5px);}
      72%{transform:translateX(5px);} 90%{transform:translateX(-2px);}
    }
    @keyframes slotPop {
      0%{transform:scale(1);} 40%{transform:scale(1.15);} 100%{transform:scale(1);}
    }
    @keyframes successGlow {
      0%{box-shadow:0 0 0 0 rgba(184,208,176,0.6);background:var(--slot-filled);}
      50%{box-shadow:0 0 0 10px rgba(184,208,176,0);background:rgba(184,208,176,0.25);}
      100%{box-shadow:0 0 0 0 rgba(184,208,176,0);}
    }
    .slot.success { animation: successGlow 0.6s ease forwards; border-color: rgba(184,208,176,0.5) !important; }
    .slot.success .slot-dot { background: #b8d0b0; box-shadow: 0 0 12px rgba(184,208,176,0.9); }
  </style>
</head>
<body>

<canvas id="sky-canvas"></canvas>
<div class="ambient-base"></div>

<div class="page">
  <span class="eyebrow">private entrance</span>

  <div class="slots" id="slots">
    <div class="slot" id="s0"><div class="slot-dot"></div></div>
    <div class="slot" id="s1"><div class="slot-dot"></div></div>
    <div class="slot" id="s2"><div class="slot-dot"></div></div>
    <div class="slot" id="s3"><div class="slot-dot"></div></div>
  </div>

  <div class="keypad" id="keypad">
    <button class="key" data-val="1"><span class="key-num">1</span></button>
    <button class="key" data-val="2"><span class="key-num">2</span><span class="key-sub">abc</span></button>
    <button class="key" data-val="3"><span class="key-num">3</span><span class="key-sub">def</span></button>
    <button class="key" data-val="4"><span class="key-num">4</span><span class="key-sub">ghi</span></button>
    <button class="key" data-val="5"><span class="key-num">5</span><span class="key-sub">jkl</span></button>
    <button class="key" data-val="6"><span class="key-num">6</span><span class="key-sub">mno</span></button>
    <button class="key" data-val="7"><span class="key-num">7</span><span class="key-sub">pqrs</span></button>
    <button class="key" data-val="8"><span class="key-num">8</span><span class="key-sub">tuv</span></button>
    <button class="key" data-val="9"><span class="key-num">9</span><span class="key-sub">wxyz</span></button>
    <button class="key special" id="backKey"><span class="key-num">Back</span></button>
    <button class="key" data-val="0"><span class="key-num">0</span></button>
    <button class="key special enter-key" id="enterKey"><span class="key-num">Enter</span></button>
  </div>
</div>

<div class="popup-overlay" id="popup">
  <div class="popup">
    <p class="popup-text" id="popupText">Haha, try again cutie.</p>
    <p class="popup-sub">that's not quite right</p>
  </div>
</div>

<div id="starburst"></div>
<div id="veil"></div>

<script src="js/stars.js" defer></script>
<script src="js/app.js" defer></script>
<script src="js/pwa.js" defer></script>
<script>
  window.SKY_CONFIG = {
    starCount:      'auto',
    starColor:      [228, 218, 208],
    shootingStars:  true,
    shootColor:     [240, 192, 208],
    shootGlow:      true,
    cloudLayer:     false,
    starBrightness: 0.62,
  };

  const CORRECT = '9983'; // ← your password
  const WRONG_MSGS = [
    'Haha, try again cutie.',
    'Nope. You\'re adorable though.',
    'That\'s not it, Ashu.',
    'You really thought that would work?',
    'So close. Just kidding, not even close.',
    'Almost… not really.',
  ];

  let input = '', locked = false;
  const slots  = [0,1,2,3].map(i => document.getElementById('s'+i));
  const popup  = document.getElementById('popup');
  const popTxt = document.getElementById('popupText');

  function updateSlots() {
    slots.forEach((s, i) => {
      if (i < input.length) {
        if (!s.classList.contains('filled')) {
          s.classList.add('filled');
          s.style.animation = 'slotPop 0.3s var(--ease-out)';
          setTimeout(() => s.style.animation = '', 320);
        }
      } else {
        s.classList.remove('filled', 'success');
      }
    });
  }

  function pressAnim(btn) {
    btn.classList.add('pressed');
    setTimeout(() => btn.classList.remove('pressed'), 160);
  }

  function handleDigit(d) {
    if (locked || input.length >= 4) return;
    input += d;
    updateSlots();
    if (input.length === 4) setTimeout(checkPassword, 120);
  }

  function handleBack() {
    if (locked) return;
    input = input.slice(0, -1);
    updateSlots();
  }

  function checkPassword() {
    if (input === CORRECT) {
      slots.forEach((s, i) => setTimeout(() => s.classList.add('success'), i * 80));
      locked = true;
      setTimeout(() => window.navigateTo('home.html', 1100), 700);
    } else {
      locked = true;
      slots.forEach(s => {
        s.style.animation = 'slotShake 0.45s ease';
        setTimeout(() => s.style.animation = '', 480);
      });
      popTxt.textContent = WRONG_MSGS[Math.floor(Math.random() * WRONG_MSGS.length)];
      popup.classList.add('open');
      setTimeout(() => {
        popup.classList.remove('open');
        setTimeout(() => { input = ''; updateSlots(); locked = false; }, 400);
      }, 2200);
    }
  }

  document.getElementById('keypad').addEventListener('click', e => {
    const btn = e.target.closest('.key');
    if (!btn) return;
    pressAnim(btn);
    if (btn.id === 'backKey')  { handleBack(); return; }
    if (btn.id === 'enterKey') { if (input.length === 4) checkPassword(); return; }
    const v = btn.dataset.val;
    if (v !== undefined) handleDigit(v);
  });

  document.addEventListener('keydown', e => {
    if (e.key >= '0' && e.key <= '9') handleDigit(e.key);
    if (e.key === 'Backspace')         handleBack();
    if (e.key === 'Enter' && input.length === 4) checkPassword();
  });
</script>
</body>
</html>
