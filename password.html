<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Enter — Ashu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@200;300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    :root {
      --bg:          #09090f;
      --surface:     rgba(255,255,255,0.028);
      --border:      rgba(255,255,255,0.07);
      --text:        #d8d0c8;
      --text-dim:    #504c4a;
      --pink:        #e8b4c0;
      --pink-soft:   #f0ccd6;
      --pink-glow:   rgba(232,180,192,0.22);
      --pink-glow2:  rgba(232,180,192,0.08);
      --lavender:    #b8b0c8;
      --slot-empty:  rgba(255,255,255,0.05);
      --slot-filled: rgba(232,180,192,0.18);
      --font-serif:  'Cormorant Garamond', Georgia, serif;
      --font-sans:   'Jost', sans-serif;
      --ease-out:    cubic-bezier(0.22,1,0.36,1);
    }

    html, body {
      width:100%; height:100%;
      background: var(--bg);
      font-family: var(--font-sans);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Canvas ── */
    #sky { position:fixed; inset:0; z-index:0; pointer-events:none; }

    /* ── Ambient ── */
    .amb {
      position:fixed; inset:0; z-index:1; pointer-events:none;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%,   rgba(232,180,192,0.055) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 50% 100%, rgba(180,158,136,0.04)  0%, transparent 55%),
        radial-gradient(ellipse 40% 30% at 15% 50%,  rgba(184,176,200,0.03)  0%, transparent 50%);
    }

    /* ── Page layout ── */
    .page {
      position: fixed; inset:0; z-index:10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 1.6rem;
      gap: 0;
    }

    /* ── Eyebrow ── */
    .eyebrow {
      font-size: 0.54rem;
      font-weight: 200;
      letter-spacing: 0.44em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 2rem;
      opacity: 0;
      animation: rise 1.4s var(--ease-out) 0.2s forwards;
    }

    /* ── 4 Password slots ── */
    .slots {
      display: flex;
      gap: 1rem;
      margin-bottom: 2.6rem;
      opacity: 0;
      animation: rise 1.6s var(--ease-out) 0.45s forwards;
    }

    .slot {
      width: 52px;
      height: 52px;
      border-radius: 3px;
      background: var(--slot-empty);
      border: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .slot::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 60%);
    }

    .slot.filled {
      background: var(--slot-filled);
      border-color: rgba(232,180,192,0.35);
      box-shadow:
        0 0 14px rgba(232,180,192,0.18),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .slot-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--pink-soft);
      box-shadow: 0 0 10px rgba(232,180,192,0.8);
      opacity: 0;
      transform: scale(0);
      transition: opacity 0.25s ease, transform 0.35s var(--ease-out);
    }

    .slot.filled .slot-dot {
      opacity: 1;
      transform: scale(1);
    }

    /* ── Keypad container ── */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      width: 100%;
      max-width: 280px;
      opacity: 0;
      animation: rise 1.6s var(--ease-out) 0.7s forwards;
    }

    /* ── Key button ── */
    .key {
      position: relative;
      height: 68px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      overflow: hidden;
      transition:
        background   0.25s ease,
        border-color 0.25s ease,
        transform    0.18s var(--ease-out),
        box-shadow   0.3s ease;
      /* glossy top sheen */
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* glossy layer */
    .key::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 45%;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.07) 0%,
        rgba(255,255,255,0.02) 100%
      );
      border-radius: 4px 4px 0 0;
      pointer-events: none;
    }

    /* pink inner glow edge */
    .key::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 4px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
      pointer-events: none;
    }

    .key:hover {
      background: rgba(232,180,192,0.09);
      border-color: rgba(232,180,192,0.28);
      box-shadow:
        0 0 20px rgba(232,180,192,0.12),
        0 0 6px  rgba(232,180,192,0.08);
    }

    .key:active, .key.pressed {
      transform: scale(0.93);
      background: rgba(232,180,192,0.16);
      border-color: rgba(232,180,192,0.45);
      box-shadow:
        0 0 28px rgba(232,180,192,0.22),
        0 0 10px rgba(232,180,192,0.14);
    }

    /* number */
    .key-num {
      font-family: var(--font-sans);
      font-weight: 300;
      font-size: 1.3rem;
      color: var(--text);
      letter-spacing: 0.02em;
      line-height: 1;
      position: relative; z-index:1;
      transition: color 0.25s ease;
    }
    .key:hover .key-num  { color: var(--pink-soft); }
    .key:active .key-num { color: #fff; }

    /* sub-letters (like phone) — very subtle */
    .key-sub {
      font-size: 0.38rem;
      font-weight: 200;
      letter-spacing: 0.22em;
      color: var(--text-dim);
      text-transform: uppercase;
      position: relative; z-index:1;
      transition: color 0.25s ease;
    }
    .key:hover .key-sub { color: rgba(232,180,192,0.5); }

    /* special keys: Back, Enter */
    .key.special .key-num {
      font-size: 0.58rem;
      font-weight: 200;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .key.special:hover .key-num { color: var(--pink-soft); }

    /* Enter key — pink tinted */
    .key.enter-key {
      background: rgba(232,180,192,0.07);
      border-color: rgba(232,180,192,0.2);
    }
    .key.enter-key .key-num {
      color: var(--pink);
      font-size: 0.58rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
    .key.enter-key:hover {
      background: rgba(232,180,192,0.14);
      border-color: rgba(232,180,192,0.4);
      box-shadow: 0 0 24px rgba(232,180,192,0.2), 0 0 8px rgba(232,180,192,0.12);
    }
    .key.enter-key.pressed {
      background: rgba(232,180,192,0.22);
      border-color: rgba(232,180,192,0.6);
      box-shadow: 0 0 36px rgba(232,180,192,0.3), 0 0 14px rgba(232,180,192,0.2);
    }

    /* ── Wrong popup ── */
    .popup-overlay {
      position: fixed; inset:0; z-index:500;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .popup-overlay.open { opacity:1; pointer-events:all; }

    .popup {
      width: min(82vw, 320px);
      padding: 2rem 1.8rem;
      background: rgba(18,14,20,0.82);
      border: 1px solid rgba(232,180,192,0.18);
      border-radius: 4px;
      text-align: center;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow:
        0 0 40px rgba(232,180,192,0.1),
        0 24px 60px rgba(0,0,0,0.5);
      transform: scale(0.92) translateY(8px);
      transition: transform 0.4s var(--ease-out);
    }
    .popup-overlay.open .popup {
      transform: scale(1) translateY(0);
    }

    .popup-text {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 300;
      font-size: 1.05rem;
      color: var(--pink-soft);
      letter-spacing: 0.04em;
      line-height: 1.6;
    }

    .popup-sub {
      margin-top: 0.6rem;
      font-size: 0.54rem;
      font-weight: 200;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    /* ── Slot shake ── */
    @keyframes slotShake {
      0%,100% { transform:translateX(0); }
      18%      { transform:translateX(-7px); }
      36%      { transform:translateX(7px); }
      54%      { transform:translateX(-5px); }
      72%      { transform:translateX(5px); }
      90%      { transform:translateX(-2px); }
    }

    /* ── Slot pop (on fill) ── */
    @keyframes slotPop {
      0%   { transform:scale(1); }
      40%  { transform:scale(1.15); }
      100% { transform:scale(1); }
    }

    /* ── Success glow ── */
    @keyframes successGlow {
      0%   { box-shadow: 0 0 0 0 rgba(184,208,176,0.6); background: var(--slot-filled); }
      50%  { box-shadow: 0 0 0 10px rgba(184,208,176,0); background: rgba(184,208,176,0.25); }
      100% { box-shadow: 0 0 0 0 rgba(184,208,176,0); }
    }

    .slot.success {
      animation: successGlow 0.6s ease forwards;
      border-color: rgba(184,208,176,0.5) !important;
    }
    .slot.success .slot-dot {
      background: #b8d0b0;
      box-shadow: 0 0 12px rgba(184,208,176,0.9);
    }

    /* ── Page rise ── */
    @keyframes rise {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @keyframes fadein {
      from { opacity:0; } to { opacity:1; }
    }

    /* ── Veil ── */
    #veil {
      position:fixed; inset:0; background:var(--bg); z-index:1000;
      opacity:1; pointer-events:all;
      transition: opacity 0.9s ease;
    }
    #veil.clear { opacity:0; pointer-events:none; }
  </style>
</head>
<body>

<canvas id="sky"></canvas>
<div class="amb"></div>

<div class="page">

  <!-- eyebrow -->
  <span class="eyebrow">private entrance</span>

  <!-- 4 slots -->
  <div class="slots" id="slots">
    <div class="slot" id="s0"><div class="slot-dot"></div></div>
    <div class="slot" id="s1"><div class="slot-dot"></div></div>
    <div class="slot" id="s2"><div class="slot-dot"></div></div>
    <div class="slot" id="s3"><div class="slot-dot"></div></div>
  </div>

  <!-- keypad -->
  <div class="keypad" id="keypad">
    <!-- row 1 -->
    <button class="key" data-val="1"><span class="key-num">1</span></button>
    <button class="key" data-val="2"><span class="key-num">2</span><span class="key-sub">abc</span></button>
    <button class="key" data-val="3"><span class="key-num">3</span><span class="key-sub">def</span></button>
    <!-- row 2 -->
    <button class="key" data-val="4"><span class="key-num">4</span><span class="key-sub">ghi</span></button>
    <button class="key" data-val="5"><span class="key-num">5</span><span class="key-sub">jkl</span></button>
    <button class="key" data-val="6"><span class="key-num">6</span><span class="key-sub">mno</span></button>
    <!-- row 3 -->
    <button class="key" data-val="7"><span class="key-num">7</span><span class="key-sub">pqrs</span></button>
    <button class="key" data-val="8"><span class="key-num">8</span><span class="key-sub">tuv</span></button>
    <button class="key" data-val="9"><span class="key-num">9</span><span class="key-sub">wxyz</span></button>
    <!-- row 4 -->
    <button class="key special" id="backKey"><span class="key-num">Back</span></button>
    <button class="key" data-val="0"><span class="key-num">0</span></button>
    <button class="key special enter-key" id="enterKey"><span class="key-num">Enter</span></button>
  </div>

</div>

<!-- Wrong password popup -->
<div class="popup-overlay" id="popup">
  <div class="popup">
    <p class="popup-text" id="popupText">Haha, try again cutie.</p>
    <p class="popup-sub">that's not quite right</p>
  </div>
</div>

<div id="veil"></div>

<script>
/* ══ Star canvas ══════════════════════════════════════════ */
(function(){
  const cv=document.getElementById('sky');
  const ctx=cv.getContext('2d');
  let W,H,stars=[],comets=[],last=0;

  function resize(){
    W=cv.width=window.innerWidth;
    H=cv.height=window.innerHeight;
    stars=[];
    const n=Math.round(W*H/3600);
    for(let i=0;i<n;i++){
      stars.push({
        x:Math.random()*W, y:Math.random()*H,
        r:Math.random()*0.9+0.1,
        base:Math.random()*0.5+0.05,
        spd:Math.random()*0.003+0.0006,
        phi:Math.random()*Math.PI*2,
        pink:Math.random()<0.08,
      });
    }
  }

  function comet(){
    return {
      x:Math.random()*W*0.7+W*0.05,
      y:Math.random()*H*0.4,
      len:55+Math.random()*90,
      spd:5+Math.random()*4.5,
      angle:(Math.PI/5.5)+(Math.random()-0.5)*0.28,
      a:0, fade:'in',
      pink:Math.random()<0.72,
    };
  }

  function frame(t){
    ctx.clearRect(0,0,W,H);
    for(const s of stars){
      s.phi+=s.spd;
      const a=s.base*(0.78+0.22*Math.sin(s.phi));
      if(s.pink){
        const rg=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*2.8);
        rg.addColorStop(0,`rgba(240,192,208,${a*1.5})`);
        rg.addColorStop(1,`rgba(240,192,208,0)`);
        ctx.beginPath();ctx.arc(s.x,s.y,s.r*2.8,0,Math.PI*2);
        ctx.fillStyle=rg;ctx.fill();
      }
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=s.pink?`rgba(240,192,208,${a})`:`rgba(225,215,205,${a})`;
      ctx.fill();
    }

    if(t-last>3800+Math.random()*4200){
      comets.push(comet());
      if(Math.random()<0.25) setTimeout(()=>comets.push(comet()),300+Math.random()*450);
      last=t;
    }

    for(let i=comets.length-1;i>=0;i--){
      const c=comets[i];
      if(c.fade==='in') c.a=Math.min(1,c.a+0.06);
      else              c.a=Math.max(0,c.a-0.028);
      if(c.a>=1) c.fade='out';
      if(c.a<=0){comets.splice(i,1);continue;}

      c.x+=Math.cos(c.angle)*c.spd;
      c.y+=Math.sin(c.angle)*c.spd;
      const tx=c.x-Math.cos(c.angle)*c.len;
      const ty=c.y-Math.sin(c.angle)*c.len;
      const g=ctx.createLinearGradient(tx,ty,c.x,c.y);

      if(c.pink){
        g.addColorStop(0,  `rgba(240,192,208,0)`);
        g.addColorStop(0.4,`rgba(240,192,208,${c.a*0.3})`);
        g.addColorStop(0.8,`rgba(250,215,225,${c.a*0.7})`);
        g.addColorStop(1,  `rgba(255,232,240,${c.a})`);
      } else {
        g.addColorStop(0,  `rgba(228,218,208,0)`);
        g.addColorStop(0.5,`rgba(228,218,208,${c.a*0.4})`);
        g.addColorStop(1,  `rgba(248,242,236,${c.a})`);
      }

      ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(c.x,c.y);
      ctx.strokeStyle=g;ctx.lineWidth=c.pink?1.7:1.2;ctx.stroke();

      // tip glow
      const gc=c.pink?[255,210,228]:[255,248,240];
      const tr=c.pink?5.5:3.5;
      const rg=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,tr);
      rg.addColorStop(0,`rgba(${gc},${c.a*0.95})`);
      rg.addColorStop(1,`rgba(${gc},0)`);
      ctx.beginPath();ctx.arc(c.x,c.y,tr,0,Math.PI*2);
      ctx.fillStyle=rg;ctx.fill();

      if(c.pink){
        const h=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,14);
        h.addColorStop(0,`rgba(240,192,208,${c.a*0.4})`);
        h.addColorStop(1,`rgba(240,192,208,0)`);
        ctx.beginPath();ctx.arc(c.x,c.y,14,0,Math.PI*2);
        ctx.fillStyle=h;ctx.fill();
      }
    }
    requestAnimationFrame(frame);
  }

  resize();requestAnimationFrame(frame);
  window.addEventListener('resize',()=>{clearTimeout(window._rt);window._rt=setTimeout(resize,120);});
})();

/* ══ Veil ══════════════════════════════════════════════════ */
window.addEventListener('load',()=>{
  const v=document.getElementById('veil');
  requestAnimationFrame(()=>requestAnimationFrame(()=>v.classList.add('clear')));
});

/* ══ Password logic ═══════════════════════════════════════ */
const CORRECT = '1107'; // ← SET YOUR PASSWORD HERE
const WRONG_MSGS = [
  'Haha, try again cutie.',
  'Nope. You\'re adorable though.',
  'That\'s not it, Ashu.',
  'You really thought that would work?',
  'So close. Just kidding, not even close.',
  'Almost… not really.',
];

let input = '';
let locked = false;

const slots   = [0,1,2,3].map(i=>document.getElementById('s'+i));
const popup   = document.getElementById('popup');
const popText = document.getElementById('popupText');

function updateSlots(){
  slots.forEach((s,i)=>{
    if(i<input.length){
      if(!s.classList.contains('filled')){
        s.classList.add('filled');
        s.style.animation='slotPop 0.3s var(--ease-out)';
        setTimeout(()=>s.style.animation='',320);
      }
    } else {
      s.classList.remove('filled','success');
    }
  });
}

function pressAnim(btn){
  btn.classList.add('pressed');
  setTimeout(()=>btn.classList.remove('pressed'),160);
}

function handleDigit(d){
  if(locked||input.length>=4) return;
  input+=d;
  updateSlots();
  if(input.length===4) setTimeout(checkPassword,120);
}

function handleBack(){
  if(locked) return;
  input=input.slice(0,-1);
  updateSlots();
}

function checkPassword(){
  if(input===CORRECT){
    // success
    slots.forEach((s,i)=>{
      setTimeout(()=>{
        s.classList.add('success');
      },i*80);
    });
    locked=true;
    setTimeout(()=>{
      const veil=document.getElementById('veil');
      veil.classList.remove('clear');
      setTimeout(()=>window.location.href='home.html',1100);
    },700);
  } else {
    // wrong
    locked=true;
    slots.forEach(s=>{
      s.style.animation='slotShake 0.45s ease';
      setTimeout(()=>s.style.animation='',480);
    });
    const msg=WRONG_MSGS[Math.floor(Math.random()*WRONG_MSGS.length)];
    popText.textContent=msg;
    popup.classList.add('open');
    setTimeout(()=>{
      popup.classList.remove('open');
      setTimeout(()=>{
        input='';
        updateSlots();
        locked=false;
      },400);
    },2200);
  }
}

// Keypad clicks
document.getElementById('keypad').addEventListener('click',e=>{
  const btn=e.target.closest('.key');
  if(!btn) return;
  pressAnim(btn);
  if(btn.id==='backKey')  { handleBack(); return; }
  if(btn.id==='enterKey') {
    if(input.length===4) checkPassword();
    return;
  }
  const v=btn.dataset.val;
  if(v!==undefined) handleDigit(v);
});

// Physical keyboard support
document.addEventListener('keydown',e=>{
  if(e.key>='0'&&e.key<='9') handleDigit(e.key);
  if(e.key==='Backspace')    handleBack();
  if(e.key==='Enter'&&input.length===4) checkPassword();
});
</script>
</body>
      </html>
